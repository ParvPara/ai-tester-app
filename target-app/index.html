<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Express Checkout - Demo Target App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #94a3b8; }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 0.65rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; }
        button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-secondary { background: #475569; color: #e2e8f0; }
        .status-msg { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; display: none; font-size: 0.85rem; }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }
        .header-icon { width: 48px; height: 48px; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Seeded Accessibility Bug: Missing alt tag on image icon -->
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2338bdf8'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z'/></svg>" class="header-icon">
        
        <h2>Quick Checkout</h2>
        
        <form id="checkout-form">
            <!-- Seeded Accessibility Bug: Input has no associated <label> or aria-label -->
            <div class="form-group">
                <input type="number" id="item-quantity" placeholder="Enter item quantity (1-100)">
            </div>

            <div class="form-group">
                <label for="promo-code">Promo Code</label>
                <input type="text" id="promo-code" name="promo_code" placeholder="e.g. SAVE20">
            </div>

            <div class="btn-group">
                <button type="submit" id="submit-order-btn" class="btn-primary">Place Order</button>
                <button type="button" id="claim-promo-btn" class="btn-secondary">Fetch Discount</button>
            </div>
        </form>

        <div id="status-message" class="status-msg"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
