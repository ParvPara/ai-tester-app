<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONTUR Acoustics — Checkout</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-elevated: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text-main: #f4f4f5;
            --text-muted: #71717a;
            --text-dim: #52525b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }
        .navbar {
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.4rem 0;
            transition: color 0.15s ease;
        }
        .nav-link:hover { color: var(--text-main); }
        .nav-link.active {
            color: var(--text-main);
            border-bottom: 1px solid var(--text-main);
        }
        .hero {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem;
            max-width: 720px;
            margin: 0 auto;
        }
        .step-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
        }
        .step-item.active { color: var(--text-main); font-weight: 600; }
        .step-item.done { color: var(--text-muted); }
        .hero h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background: var(--surface);
            padding: 2.25rem;
            border-radius: 8px;
            margin: 0 auto 5rem;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 500;
        }
        input[type="text"], select {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-elevated);
            color: var(--text-main);
            font-size: 0.875rem;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.85rem center;
            background-size: 1em;
            padding-right: 2.5rem;
        }
        button {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            letter-spacing: 0.01em;
            background: #ffffff;
            color: #09090b;
            transition: all 0.15s ease;
            margin-top: 1rem;
        }
        button:hover {
            background: #e4e4e7;
            border-color: #e4e4e7;
        }
        .status-msg {
            margin-top: 1.25rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            display: none;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .error {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .success {
            background: rgba(16, 185, 129, 0.08);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .header-icon {
            width: 20px;
            height: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">
            <!-- Seeded Accessibility Bug: Missing alt attribute on brand logo -->
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='white'><rect x='3' y='3' width='18' height='18' rx='2' stroke-width='2'/><circle cx='8.5' cy='8.5' r='1.5' fill='white'/><path d='M21 15l-5-5L5 21' stroke-width='2'/></svg>" class="header-icon">
            <span>Kontur Acoustics</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">1. Catalog</a>
            <a href="/cart.html" class="nav-link">2. Cart</a>
            <a href="/checkout.html" class="nav-link active">3. Checkout</a>
        </nav>
    </header>

    <div class="hero">
        <div class="step-bar">
            <span class="step-item done">01 / Catalog</span>
            <span class="step-item done">02 / Review</span>
            <span class="step-item active">03 / Checkout</span>
        </div>
        <h1>Order Finalization</h1>
    </div>

    <main class="container">
        <form id="checkout-form">
            <div class="form-group">
                <!-- Seeded Accessibility Bug: Missing label tag on customer-name -->
                <input type="text" id="customer-name" placeholder="Full delivery name (e.g. Jane Doe)">
            </div>

            <div class="form-group">
                <label for="shipping-tier">Dispatch Carrier</label>
                <select id="shipping-tier">
                    <option value="standard">Standard Ground Carrier (3-5 business days)</option>
                    <option value="express">Express Overnight Dispatch ($24.99)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gift-note">Delivery Instructions</label>
                <input type="text" id="gift-note" placeholder="Special handling or entry code (plain text only)">
            </div>

            <button type="submit" id="submit-order-btn">Authorize & Dispatch Order</button>
        </form>

        <div id="status-message" class="status-msg"></div>
    </main>

    <script>
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const customerName = document.getElementById('customer-name').value.trim();
            const shippingTier = document.getElementById('shipping-tier').value;
            const giftNote = document.getElementById('gift-note').value;
            const statusMsg = document.getElementById('status-message');

            const savedQty = Number(localStorage.getItem('cart_quantity') || '1');

            // Seeded Hard Bug 4: Script/HTML injection syntax crash on gift note
            if (giftNote && (giftNote.includes('<') || giftNote.includes('>') || giftNote.includes(';') || giftNote.includes("'") || giftNote.includes('"'))) {
                throw new Error("Uncaught DOMException: Failed to sanitize unsafe gift note payload: '" + giftNote + "'");
            }

            // Seeded Hard Bug 5: Range/Capacity Overflow on express shipping with high quantity
            if (savedQty > 50 && shippingTier === 'express') {
                throw new Error("Uncaught RangeError: Order quantity (" + savedQty + ") exceeds maximum express courier cargo capacity (limit: 50)");
            }

            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg success';
            statusMsg.textContent = "Order confirmed for " + (customerName || "Recipient") + " via " + shippingTier + ".";
        });
    </script>
</body>
</html>
