<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioGear Direct - Express Checkout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .navbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .hero {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
        .step-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 0.75rem 0 2rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .step-item { color: #64748b; }
        .step-item.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; padding-bottom: 4px; }
        .step-item.done { color: #10b981; }
        .container {
            width: 100%;
            max-width: 540px;
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin: 0 auto 3rem;
            box-sizing: border-box;
            border: 1px solid #334155;
        }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #94a3b8; }
        input[type="text"], select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 0.95rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            background: #0284c7;
            color: white;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        button:hover { background: #0369a1; }
        .status-msg {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            font-size: 0.85rem;
        }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }
        .header-icon { width: 32px; height: 32px; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2338bdf8'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z'/></svg>" class="header-icon" alt="">
            <span>AudioGear Direct</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">1. Catalog</a>
            <a href="/cart.html" class="nav-link">2. Shopping Cart (🛒)</a>
            <a href="/checkout.html" class="nav-link active">3. Checkout (💳)</a>
        </nav>
    </header>

    <div class="hero">
        <div class="step-bar">
            <span class="step-item done">✓ Step 1: Catalog</span>
            <span class="step-item done">✓ Step 2: Cart Review</span>
            <span class="step-item active">Step 3: Express Checkout</span>
        </div>
        <h1>Finalize Your Order</h1>
    </div>

    <main class="container">
        <form id="checkout-form">
            <div class="form-group">
                <!-- Seeded Accessibility Bug: Missing label tag on customer-name -->
                <input type="text" id="customer-name" placeholder="Full delivery name (e.g. Jane Doe)">
            </div>

            <div class="form-group">
                <label for="shipping-tier">Courier Delivery Method</label>
                <select id="shipping-tier">
                    <option value="standard">Standard Ground Courier (3-5 business days)</option>
                    <option value="express">Overnight Express Courier ($24.99)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gift-note">Gift Delivery Instructions / Note</label>
                <input type="text" id="gift-note" placeholder="Optional delivery instructions (plain text only)">
            </div>

            <button type="submit" id="submit-order-btn">Authorize Payment & Place Order</button>
        </form>

        <div id="status-message" class="status-msg"></div>
    </main>

    <script>
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const customerName = document.getElementById('customer-name').value.trim();
            const shippingTier = document.getElementById('shipping-tier').value;
            const giftNote = document.getElementById('gift-note').value;
            const statusMsg = document.getElementById('status-message');

            const savedQty = Number(localStorage.getItem('cart_quantity') || '1');

            // Seeded Hard Bug 4: Script/HTML injection syntax crash on gift note
            if (giftNote && (giftNote.includes('<') || giftNote.includes('>') || giftNote.includes(';') || giftNote.includes("'") || giftNote.includes('"'))) {
                throw new Error("Uncaught DOMException: Failed to sanitize unsafe gift note payload: '" + giftNote + "'");
            }

            // Seeded Hard Bug 5: Range/Capacity Overflow on express shipping with high quantity
            if (savedQty > 50 && shippingTier === 'express') {
                throw new Error("Uncaught RangeError: Order quantity (" + savedQty + ") exceeds maximum express courier cargo capacity (limit: 50)");
            }

            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg success';
            statusMsg.textContent = "Thank you! Order successfully placed for " + (customerName || "Customer") + " via " + shippingTier + ".";
        });
    </script>
</body>
</html>
