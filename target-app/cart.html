<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONTUR Acoustics — Order Review</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-elevated: #18181b;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);
            --text-main: #f4f4f5;
            --text-muted: #71717a;
            --text-dim: #52525b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
        }
        .navbar {
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.4rem 0;
            transition: color 0.15s ease;
        }
        .nav-link:hover { color: var(--text-main); }
        .nav-link.active {
            color: var(--text-main);
            border-bottom: 1px solid var(--text-main);
        }
        .hero {
            text-align: center;
            padding: 3.5rem 1.5rem 2rem;
            max-width: 720px;
            margin: 0 auto;
        }
        .step-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
        }
        .step-item.active { color: var(--text-main); font-weight: 600; }
        .step-item.done { color: var(--text-muted); }
        .hero h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
        }
        .container {
            width: 100%;
            max-width: 580px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 8px;
            margin: 0 auto 5rem;
            border: 1px solid var(--border);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .cart-item-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .cart-item-qty {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .cart-item-price {
            font-size: 1.15rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .cart-section {
            margin-top: 1.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .cart-section h4 {
            margin-bottom: 0.75rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .input-group { display: flex; gap: 0.5rem; }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 0.85rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-elevated);
            color: var(--text-main);
            font-size: 0.875rem;
            transition: border-color 0.15s ease;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }
        button, .btn-action {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            letter-spacing: 0.01em;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            transition: all 0.15s ease;
            box-sizing: border-box;
            text-align: center;
            text-decoration: none;
        }
        button:hover, .btn-action:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-hover);
        }
        .btn-checkout {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #09090b;
            border: 1px solid #ffffff;
            padding: 0.85rem;
            font-weight: 600;
            margin-top: 2rem;
        }
        .btn-checkout:hover {
            background: #e4e4e7;
            border-color: #e4e4e7;
        }
        .status-msg {
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            border-radius: 6px;
            display: none;
            font-size: 0.825rem;
        }
        .error {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .success {
            background: rgba(16, 185, 129, 0.08);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .header-icon {
            width: 20px;
            height: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">
            <!-- Seeded Accessibility Bug: Missing alt attribute on brand logo -->
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='white'><rect x='3' y='3' width='18' height='18' rx='2' stroke-width='2'/><circle cx='8.5' cy='8.5' r='1.5' fill='white'/><path d='M21 15l-5-5L5 21' stroke-width='2'/></svg>" class="header-icon">
            <span>Kontur Acoustics</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">1. Catalog</a>
            <a href="/cart.html" class="nav-link active">2. Cart</a>
            <a href="/checkout.html" class="nav-link">3. Checkout</a>
        </nav>
    </header>

    <div class="hero">
        <div class="step-bar">
            <span class="step-item done">01 / Catalog</span>
            <span class="step-item active">02 / Review</span>
            <span class="step-item">03 / Checkout</span>
        </div>
        <h1>Order Review</h1>
    </div>

    <main class="container">
        <div class="cart-item">
            <div>
                <div class="cart-item-title">Kontur-1 Reference Headphones</div>
                <div class="cart-item-qty" id="cart-item-qty">Quantity: 1</div>
            </div>
            <div class="cart-item-price">$199.00</div>
        </div>

        <!-- Section 1: Promo Code -->
        <div class="cart-section">
            <h4>Promotional Voucher</h4>
            <div class="input-group">
                <!-- Seeded Accessibility Bug: Missing label tag on promo-code -->
                <input type="text" id="promo-code" placeholder="Enter coupon code (e.g. SAVE20)">
                <button type="button" id="claim-promo-btn">Apply Code</button>
            </div>
            <div id="promo-status" class="status-msg"></div>
        </div>

        <!-- Section 2: Live Shipping Rates -->
        <div class="cart-section">
            <h4>Freight Calculation</h4>
            <button type="button" id="calc-shipping-btn" style="width: 100%;">Calculate Carrier Rates</button>
            <div id="shipping-status" class="status-msg"></div>
        </div>

        <!-- Navigation Link to Checkout -->
        <a href="/checkout.html" id="proceed-checkout-btn" class="btn-action btn-checkout">Proceed to Checkout (Step 3) ➔</a>
    </main>

    <script>
        const savedQty = localStorage.getItem('cart_quantity');
        if (savedQty) {
            document.getElementById('cart-item-qty').textContent = 'Quantity: ' + savedQty;
        }

        // Seeded Hard Bug 2: Failed Network Request (HTTP 404)
        document.getElementById('claim-promo-btn').addEventListener('click', async () => {
            const promoInput = document.getElementById('promo-code');
            const statusMsg = document.getElementById('promo-status');
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg';
            statusMsg.textContent = 'Validating code...';

            try {
                const res = await fetch('/api/claim-promo-discount?code=' + encodeURIComponent(promoInput.value));
                if (!res.ok) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'Validation error: HTTP ' + res.status + ' service endpoint not found';
                } else {
                    const data = await res.json();
                    statusMsg.className = 'status-msg success';
                    statusMsg.textContent = 'Discount applied: ' + data.discount + '% OFF';
                }
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Network Error: ' + err.message;
            }
        });

        // Seeded Hard Bug 3: Failed Network Request (HTTP 404)
        document.getElementById('calc-shipping-btn').addEventListener('click', async () => {
            const statusMsg = document.getElementById('shipping-status');
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg';
            statusMsg.textContent = 'Querying freight API...';

            try {
                const res = await fetch('/api/v1/shipping/rates?tier=standard');
                if (!res.ok) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'Carrier service error: HTTP ' + res.status;
                } else {
                    statusMsg.className = 'status-msg success';
                    statusMsg.textContent = 'Standard Ground: $9.99 | Express Air: $24.99';
                }
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Network Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
