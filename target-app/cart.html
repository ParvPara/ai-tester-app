<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioGear Direct - Shopping Cart</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .navbar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .hero {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
        .step-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 0.75rem 0 2rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .step-item { color: #64748b; }
        .step-item.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; padding-bottom: 4px; }
        .step-item.done { color: #10b981; }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin: 0 auto 3rem;
            box-sizing: border-box;
            border: 1px solid #334155;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #334155;
        }
        .cart-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #334155;
        }
        .cart-section h4 {
            margin: 0 0 0.75rem 0;
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .input-group { display: flex; gap: 0.5rem; }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button, .btn-action {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            background: #334155;
            color: #e2e8f0;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        button:hover, .btn-action:hover { background: #475569; }
        .btn-checkout {
            display: block;
            width: 100%;
            background: #0284c7;
            color: white;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 700;
            margin-top: 2rem;
        }
        .btn-checkout:hover { background: #0369a1; }
        .status-msg {
            margin-top: 0.75rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            font-size: 0.85rem;
        }
        .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }
        .header-icon { width: 32px; height: 32px; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="/" class="brand">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%2338bdf8'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z'/></svg>" class="header-icon" alt="">
            <span>AudioGear Direct</span>
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">1. Catalog</a>
            <a href="/cart.html" class="nav-link active">2. Shopping Cart (🛒)</a>
            <a href="/checkout.html" class="nav-link">3. Checkout (💳)</a>
        </nav>
    </header>

    <div class="hero">
        <div class="step-bar">
            <span class="step-item done">✓ Step 1: Catalog</span>
            <span class="step-item active">Step 2: Cart Review</span>
            <span class="step-item">Step 3: Express Checkout</span>
        </div>
        <h1>Review Your Shopping Cart</h1>
    </div>

    <main class="container">
        <div class="cart-item">
            <div>
                <strong>Quantum ANC Pro Headphones</strong>
                <div style="color: #94a3b8; font-size: 0.85rem;" id="cart-item-qty">Quantity: 1</div>
            </div>
            <div style="font-weight: 700; color: #38bdf8; font-size: 1.15rem;">$199.00</div>
        </div>

        <!-- Section 1: Promo Code -->
        <div class="cart-section">
            <h4>Promotional Discount Code</h4>
            <div class="input-group">
                <!-- Seeded Accessibility Bug: Missing label tag on promo-code -->
                <input type="text" id="promo-code" placeholder="Enter coupon code (e.g. SAVE20)">
                <button type="button" id="claim-promo-btn">Apply Discount</button>
            </div>
            <div id="promo-status" class="status-msg"></div>
        </div>

        <!-- Section 2: Live Shipping Rates -->
        <div class="cart-section">
            <h4>Live Shipping Estimates</h4>
            <button type="button" id="calc-shipping-btn" style="width: 100%;">Calculate Shipping Rates</button>
            <div id="shipping-status" class="status-msg"></div>
        </div>

        <!-- Navigation Link to Checkout -->
        <a href="/checkout.html" id="proceed-checkout-btn" class="btn-action btn-checkout">Proceed to Checkout (Step 3) ➔</a>
    </main>

    <script>
        const savedQty = localStorage.getItem('cart_quantity');
        if (savedQty) {
            document.getElementById('cart-item-qty').textContent = 'Quantity: ' + savedQty;
        }

        // Seeded Hard Bug 2: Failed Network Request (HTTP 404)
        document.getElementById('claim-promo-btn').addEventListener('click', async () => {
            const promoInput = document.getElementById('promo-code');
            const statusMsg = document.getElementById('promo-status');
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg';
            statusMsg.textContent = 'Checking promo code...';

            try {
                const res = await fetch('/api/claim-promo-discount?code=' + encodeURIComponent(promoInput.value));
                if (!res.ok) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'Failed to apply promo: HTTP ' + res.status;
                } else {
                    const data = await res.json();
                    statusMsg.className = 'status-msg success';
                    statusMsg.textContent = 'Discount applied: ' + data.discount + '% OFF';
                }
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Network Error: ' + err.message;
            }
        });

        // Seeded Hard Bug 3: Failed Network Request (HTTP 404)
        document.getElementById('calc-shipping-btn').addEventListener('click', async () => {
            const statusMsg = document.getElementById('shipping-status');
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg';
            statusMsg.textContent = 'Fetching carrier rates...';

            try {
                const res = await fetch('/api/v1/shipping/rates?tier=standard');
                if (!res.ok) {
                    statusMsg.className = 'status-msg error';
                    statusMsg.textContent = 'Failed to calculate rates: HTTP ' + res.status;
                } else {
                    statusMsg.className = 'status-msg success';
                    statusMsg.textContent = 'Standard Ground: $9.99 | Express Air: $24.99';
                }
            } catch (err) {
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Network Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
